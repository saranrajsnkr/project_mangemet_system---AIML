{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IMS Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <meta
      name="description"
      content="The IMS (Internship Management System) - VelTech  helps students apply for internship opportunities offered through the college with ease and organization."
    />
    <meta property="og:title" content="IMS - VelTech" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://internship-portal-i31y.onrender.com/"
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dvmocwdnn/image/upload/v1751663804/VELTECH_OG_CARD_1_mliesn.jpg"
    />
    <meta
      property="og:description"
      content="The IMS (Internship Management System) is an online platform to apply for internships directly from the college."
    />

    <link
      rel="icon"
      type="image/x-icon"
      href="{% static 'images/LOGO.png' %}"
    />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="{% static 'images/LOGO.png' %}"
    />

    <style>
      :root {
        --primary: #3b82f6;
        --accent: #06b6d4;
        --background: linear-gradient(135deg, #f8fafc, #e0f2fe);
        --surface: rgba(255, 255, 255, 0.9);
        --text-dark: #0f172a;
        --text-muted: #64748b;
        --radius: 16px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        --transition: all 0.3s ease-in-out;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--background);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1rem;
      }

      .login-container {
        background: var(--surface);
        backdrop-filter: blur(12px) saturate(180%);
        padding: 2rem;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 400px;
        text-align: center;
        animation: fadeUp 0.8s ease forwards;
        opacity: 0;
        transform: translateY(20px);
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Logos */
      .logos {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .logos img {
        height: 40px;
        max-width: 100%;
      }

      .login-container h2 {
        font-family: "Poppins", sans-serif;
        font-size: 1.5rem;
        margin-bottom: 0.3rem;
        color: var(--text-dark);
      }

      .login-container h3 {
        font-family: "Poppins", sans-serif;
        font-size: 1rem;
        margin-bottom: 1.5rem;
        color: var(--text-muted);
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center; /* Centers inputs inside */
      }

      input[type="text"],
      input[type="password"] {
        padding: 0.85rem 1rem;
        border: 1px solid #ddd;
        border-radius: var(--radius);
        font-size: 1rem;
        outline: none;
        width: 90%; /* Fix: not full edge-to-edge */
        max-width: 320px; /* Keep nice width */
        background: #f1f5f9;
        transition: var(--transition);
        text-align: left;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        background: #fff;
      }

      button {
        width: 90%;
        max-width: 120px;
      }

      button {
        background: linear-gradient(to right, var(--primary), var(--accent));
        color: #fff;
        border: none;
        padding: 0.9rem;
        border-radius: var(--radius);
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 0.5rem;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
      }

      .footer-text {
        margin-top: 1.5rem;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      /* 🔹 Responsive Fixes */
      @media (max-width: 480px) {
        .login-container {
          padding: 1.5rem;
          max-width: 95%;
        }

        .logos {
          gap: 10px;
        }

        .logos img {
          height: 32px;
        }

        .login-container h2 {
          font-size: 1.2rem;
        }

        .login-container h3 {
          font-size: 0.9rem;
        }

        button {
          font-size: 0.9rem;
          padding: 0.8rem;
        }
      }

    .msg {
      padding: 10px 12px;
      border-radius: 10px;
      margin: 6px 0;
      font-size: 0.9rem;
      text-align: left;
    }

    .msg.error { background: #fee2e2; border: 1px solid #f87171; color: #991b1b; }
    .msg.success { background: #dcfce7; border: 1px solid #22c55e; color: #14532d; }
    .msg.info { background: #e0f2fe; border: 1px solid #38bdf8; color: #075985; }
    </style>
  </head>
  <body>
    <div class="login-container">
      <!-- Logos -->
      <div class="logos">
        <img src="{% static 'images/VELTECH.png' %}" alt="VelTech Logo" />
        <img src="{% static 'images/NIRF.png' %}" alt="Category 1" />
        <img src="{% static 'images/NAAC.png' %}" alt="NAAC" />
      </div>

      <h2>Internship Management System</h2>
      <h3>Company Attendance Login</h3>
    <div class="messages">
      {% if messages %}
        {% for m in messages %}
          <div class="msg {{ m.tags }}">{{ m }}</div>
        {% endfor %}
      {% endif %}
    </div>

      <form method="post">
        {% csrf_token %} {{ form.username }} {{ form.password }}
        <button type="submit"><i class="fa fa-sign-in-alt"></i> Login</button>
      </form>

      <div class="footer-text">
        &copy; {{ year|default:2025 }} IMS - Vel Tech. All rights reserved.
      </div>
    </div>
  </body>
</html>
