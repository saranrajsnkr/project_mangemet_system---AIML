{% extends 'base.html' %}
{% block content %}
<div class="application-container">
  <h2>Apply to {{ company.name }}</h2>

  <form method="POST" class="application-form">
    {% csrf_token %}

    <div class="form-group">
      <input type="text" name="name" placeholder="Full Name" required style="text-transform: capitalize;" />
    </div>

    <div class="form-group">
      <input
        type="text"
        name="roll_number"
        placeholder="VTU Number (e.g., 24875)"
        pattern="\d{5}"
        maxlength="5"
        inputmode="numeric"
        required
        title="VTU Number should be exactly 5 digits"
        value="{{ roll_number }}" readonly
      />
    </div>

    <div class="form-group">
      <input
        type="text"
        name="mobile_number"
        placeholder="Mobile Number"
        required
        maxlength="10"
        pattern="\d{10}"
        inputmode="numeric"
        title="Mobile Number should be exactly 10 digits"
      />
    </div>

    <div class="form-group">
      <select name="department" required>
        <option value="">-- Select Department --</option>
        <option value="Artificial Intelligence (AI) and Data Science">Artificial Intelligence (AI) and Data Science</option>
        <option value="Artificial Intelligence and Machine Learning">Artificial Intelligence and Machine Learning</option>
        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
        <option value="Computer Science and Engineering (Artificial Intelligence and Machine Learning)">Computer Science and Engineering (AI & ML)</option>
        <option value="Department of Computer Science and Engineering (Cyber Security)">Computer Science and Engineering (Cyber Security)</option>
        <option value="Department of Computer Science and Engineering (Data Science)">Computer Science and Engineering (Data Science)</option>
        <option value="Computer Science and Design">Computer Science and Design</option>
        <option value="Information Technology">Information Technology</option>
      </select>
    </div>

    <button type="submit" class="submit-btn">Submit Application</button>
  </form>
</div>



<style>
  .application-container {
    max-width: 650px;
    margin: 2rem auto;
    padding: 2.5rem;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    position: relative;
    animation: fadeInUp 0.6s ease-out forwards;
  }
  @keyframes fadeInUp {
    0% {
      opacity: 0;
      transform: translateY(20px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .application-container h2 {
    text-align: center;
    font-family: "Poppins", sans-serif;
    font-size: 2rem;
    font-weight: 600;
    color: #1e293b;
    margin-bottom: 2rem;
    position: relative;
  }

  .application-container h2::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -8px;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, #2563eb, #38bdf8);
    border-radius: 3px;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  input[type="text"],
  select {
    width: 100%;
    padding: 1rem 1.2rem;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 1rem;
    font-family: "Roboto", sans-serif;
    transition: 0.3s;
    background-color: #f8fafc;
  }

  input:focus,
  select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    outline: none;
    background: white;
  }

  .submit-btn {
    width: 100%;
    background: linear-gradient(90deg, #2563eb, #38bdf8);
    color: #ffffff;
    padding: 1rem;
    font-size: 1.1rem;
    font-family: "Poppins", sans-serif;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
  }

  .submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.45);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  @media (max-width: 768px) {
    .application-container {
      padding: 2rem;
    }

    .application-container h2 {
      font-size: 1.8rem;
    }
  }

  @media (max-width: 480px) {
    .application-container {
      padding: 1.5rem;
    }

    .application-container h2 {
      font-size: 1.6rem;
    }

    input,
    select,
    .submit-btn {
      font-size: 1rem;
      padding: 0.9rem 1rem;
    }
  }
</style>
<script>
  const form = document.querySelector('.application-form');
  const button = form.querySelector('.submit-btn');

  form.addEventListener('submit', function (e) {
    if (form.checkValidity()) {
      // Disable immediately
      button.disabled = true;
      button.innerText = 'Applying...';
      button.style.cursor = 'not-allowed';

    } else {
      e.preventDefault(); // prevent invalid form submit
    }
  });
</script>

{% endblock %}
