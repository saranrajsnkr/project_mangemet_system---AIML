{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="downloadable-files-container">
    <h2>Downloadable Files</h2>
    <div class="file-list">
        {% for file in files %}
        <div class="file-item">
            <span class="file-name">{{ file.file_name }}</span>
            <a href="{{ file.file_link }}" target="_blank" class="download-btn">
                <i class="download-icon icon-{{ forloop.counter }}"></i>
                Download
            </a>
        </div>
        {% empty %}
        <div class="empty-state">No files available for download.</div>
        {% endfor %}
    </div>
</div>

<style>
/* Container */
.downloadable-files-container {
  max-width: 700px;
  margin: 2rem auto;
  padding: 2rem;
  border-radius: 12px;
  background: #ffffff;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
  font-family: 'Inter', sans-serif;
  animation: fadeUp 0.8s ease-out forwards;
}
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
  from { opacity: 0; transform: translateY(20px); }
}

/* Title */

.downloadable-files-container h2 {
  font-size: 1.7rem;
  font-weight: 600;
  margin-bottom: 1.5rem;
  color: #333;
  text-align: center;
}

/* List */
.file-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.file-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f8f9fa;
  padding: 0.8rem 1.2rem;
  border-radius: 8px;
  transition: background 0.3s ease;
}

.file-item:hover {
  background: #e2e2e2ff;
}

.file-name {
  font-weight: 500;
  color: #444;
  border-left: 4px solid var(--primary);; /* red indicator */
  padding-left: 0.8rem;
}

/* Download Button */
.download-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 1.4rem;
  font-size: 0.95rem;
  font-weight: 500;
  color: #fff;
      background: linear-gradient(to right, var(--primary), var(--accent));
      border-radius: var(--radius);
  text-decoration: none;
  transition: all 0.3s ease;
  box-shadow: 0 6px 15px rgba(37, 99, 235, 0.35);
}

.download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
}

/* Icons (FA + BI alternating) */
.download-icon {
  font-size: 1rem;
}

/* Assign different icons based on loop count */
.icon-1::before { font-family: "Font Awesome 5 Free"; content: "\f019"; font-weight: 900; } /* fa-download */
.icon-2::before { font-family: "Bootstrap-icons"; content: "\f32d"; } /* bi-download */
.icon-3::before { font-family: "Font Awesome 5 Free"; content: "\f56d"; font-weight: 900; } /* fa-file-download */
.icon-4::before { font-family: "Bootstrap-icons"; content: "\f32e"; } /* bi-cloud-download */
.icon-5::before { font-family: "Font Awesome 5 Free"; content: "\f381"; font-weight: 900; } /* fa-save */

/* Empty state */
.empty-state {
  text-align: center;
  color: #888;
  font-size: 1rem;
  padding: 1rem;
}
</style>
{% endblock %}
