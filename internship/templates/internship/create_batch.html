{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Create Project Batch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    let students = [];
    let selectedVTUs = [];
    const maxMembers = 5;
  </script>
</head>
<body class="container py-4">
  <h2 class="mb-3">Project Batch Creation</h2>

  <form id="batchForm" method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label>Your Name</label>
      <input class="form-control" value="{{ student.name }}" disabled>
    </div>
    <div class="mb-3">
      <label>Your VTU Number</label>
      <input class="form-control" value="{{ student.vtu_number }}" disabled>
    </div>

    <hr>
    <h5>Team Members (Same Year)</h5>
    <div id="memberList"></div>
    <button type="button" id="addBtn" class="btn btn-outline-primary mt-2">+ Add Student</button>
    <input type="hidden" name="members_json" id="members_json" value="[]">

    <hr>
    <div class="mb-3">
      <label>Project Title</label>
      <input type="text" name="project_title" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>One-liner About Project</label>
      <input type="text" name="project_oneliner" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Abstract</label>
      <textarea name="project_abstract" rows="4" class="form-control" required></textarea>
    </div>

    <button type="submit" class="btn btn-success">Submit Batch</button>
  </form>

  <script>
    async function loadStudents() {
      const res = await fetch("{% url 'get_students_same_year' %}");
      const data = await res.json();
      students = data.students || [];
    }

    function renderMemberSelect() {
      if (selectedVTUs.length >= maxMembers - 1) {
        alert(`Maximum ${maxMembers - 1} teammates allowed.`);
        return;
      }

      const div = document.createElement("div");
      div.className = "input-group mb-2";

      const select = document.createElement("select");
      select.className = "form-select";
      select.innerHTML = `<option value="">Select student</option>` + students
        .map(s => `<option value="${s.vtu}">${s.name} (${s.vtu})</option>`).join('');

      const removeBtn = document.createElement("button");
      removeBtn.className = "btn btn-danger";
      removeBtn.type = "button";
      removeBtn.textContent = "Remove";
      removeBtn.onclick = () => {
        selectedVTUs = selectedVTUs.filter(v => v !== select.value);
        div.remove();
        updateHidden();
      };

      select.onchange = () => {
        if (select.value && !selectedVTUs.includes(select.value)) {
          selectedVTUs.push(select.value);
        }
        updateHidden();
      };

      div.appendChild(select);
      div.appendChild(removeBtn);
      document.getElementById("memberList").appendChild(div);
    }

    function updateHidden() {
      document.getElementById("members_json").value = JSON.stringify(selectedVTUs);
    }

    document.getElementById("addBtn").addEventListener("click", renderMemberSelect);
    loadStudents();
  </script>
</body>
</html>
