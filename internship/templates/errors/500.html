{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="login-container">
  <div class="logos">
    <img src="{% static 'images/VELTECH.png' %}" alt="VelTech Logo">
  </div>

  <h2>Internship Management System</h2>

</div>

{% endblock %}
